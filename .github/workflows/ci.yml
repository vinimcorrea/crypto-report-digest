name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.mjs; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Offline demo
        run: npm run demo && test -s preview.html
