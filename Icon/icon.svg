<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="198.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
  <!-- envelope -->
  <g filter="url(#shadow)">
    <rect x="200" y="330" width="560" height="400" rx="56" fill="#fff"/>
    <path d="M222 360 L480 560 Q480 560 480 560 L738 360" fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- rising chart on the letter -->
    <polyline points="262,660 372,590 452,622 582,510" fill="none" stroke="url(#amber)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="582" cy="510" r="22" fill="#f97316"/>
  </g>
  <!-- score gauge badge -->
  <g filter="url(#shadow)">
    <circle cx="740" cy="300" r="138" fill="#0b1020"/>
    <circle cx="740" cy="300" r="100" fill="none" stroke="#1f2937" stroke-width="34"/>
    <circle cx="740" cy="300" r="100" fill="none" stroke="url(#amber)" stroke-width="34" stroke-linecap="round"
            stroke-dasharray="490 628" transform="rotate(-90 740 300)"/>
    <text x="740" y="324" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="74" font-weight="800" fill="#fff">%</text>
  </g>
</svg>
